name: Deploy Google Apps Script - Divina Locura

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar apps-script/Codigo.gs (clasp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar GitHub Secrets requeridos
        id: check
        env:
          HAS_SCRIPT: ${{ secrets.SCRIPT_ID != '' }}
          HAS_DEPLOY: ${{ secrets.DEPLOYMENT_ID != '' }}
          HAS_CLASP: ${{ secrets.CLASPRC_JSON != '' }}
        run: |
          if [ "$HAS_SCRIPT" != "true" ] || [ "$HAS_DEPLOY" != "true" ] || [ "$HAS_CLASP" != "true" ]; then
            echo "::notice::Faltan GitHub Secrets (SCRIPT_ID, DEPLOYMENT_ID, CLASPRC_JSON)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "20"

      - name: Instalar clasp
        if: steps.check.outputs.ready == 'true'
        run: npm install -g @google/clasp@3

      - name: Publicar preservando appsscript.json
        if: steps.check.outputs.ready == 'true'
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          set -euo pipefail
          test -f apps-script/Codigo.gs
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json
          mkdir -p gas_dist
          printf '{"scriptId":"%s","rootDir":"gas_dist"}\n' "$SCRIPT_ID" > .clasp.json
          clasp pull
          test -f gas_dist/appsscript.json
          find gas_dist -maxdepth 1 -type f ! -name 'appsscript.json' -delete
          cp apps-script/Codigo.gs gas_dist/
          clasp push --force
          clasp create-deployment --deploymentId "$DEPLOYMENT_ID" --description "Divina Locura (GitHub Actions)"
